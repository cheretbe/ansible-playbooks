---

# Molecule test runner. Run from inside a role directory:
#   cd roles/zabbix-agent2 && task test
# The python venv with molecule is created automatically on first use;
# 'task venv:rebuild' recreates it from scratch. Shared molecule defaults
# live in .config/molecule/config.yml (auto-discovered by molecule via the
# VCS root).

version: '3'

vars:
  VENV: '{{.ROOT_DIR}}/.venv'
  # ANSIBLE_HOME keeps collections inside the venv. Without it ansible searches
  # ~/.ansible/collections *before* the collections bundled with the venv's
  # 'ansible' package, so a stale user-wide install silently shadows the
  # pinned one (ansible-lint reports this as "Another version of ... was found
  # installed, only the first one will be used"). ANSIBLE_COLLECTIONS_PATH is
  # not enough: ansible-compat recomputes it and puts ~/.ansible back in front.
  ANSIBLE_ENV: >-
    PATH="{{.VENV}}/bin:$PATH"
    ANSIBLE_HOME="{{.VENV}}/.ansible"
  # molecule >= 25 no longer puts driver-bundled ansible modules on the
  # module path, which breaks the vagrant driver's create/destroy playbooks
  # ("couldn't resolve module/action 'vagrant'"). Export the driver's modules
  # directory explicitly until this is fixed upstream:
  # https://github.com/ansible-community/molecule-plugins/issues/301
  MOLECULE_ENV: >-
    {{.ANSIBLE_ENV}}
    ANSIBLE_LIBRARY="$('{{.VENV}}/bin/python' -c
    'import molecule_plugins.vagrant.modules as m, os; print(os.path.dirname(m.__file__))')"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  venv:
    internal: true
    dir: '{{.ROOT_DIR}}'
    status:
      - test -x '{{.VENV}}/bin/molecule'
    preconditions:
      - sh: dpkg --status python3-venv build-essential python3-dev > /dev/null 2>&1
        msg: >-
          Missing build packages. Install with:
          sudo apt install python3-venv build-essential python3-dev
    cmds:
      - python3 -m venv '{{.VENV}}'
      - '{{.VENV}}/bin/pip install --upgrade pip'
      - '{{.VENV}}/bin/pip install wheel'
      - '{{.VENV}}/bin/pip install -r requirements.txt -r dev_requirements.txt'

  venv:rebuild:
    desc: Recreate the python venv from scratch
    dir: '{{.ROOT_DIR}}'
    cmds:
      - rm -rf '{{.VENV}}'
      - task: venv

  lint:
    desc: Run ansible-lint on the role in the current directory
    deps: [venv]
    # runs from the repo root so that the root .yamllint is picked up (its name
    # is resolved against the cwd, with no walk up the tree) and so that
    # 'roles/<name>' paths are recognised as roles; the directory to lint is
    # passed as an argument instead. Run from the root to lint everything.
    dir: '{{.ROOT_DIR}}'
    cmds:
      - '{{.ANSIBLE_ENV}} ansible-lint {{.CLI_ARGS | default .USER_WORKING_DIR}}'

  test:
    desc: Lint, then run all molecule scenarios for the role in the current directory
    deps: [venv]
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      # lint first: it is seconds, while a failed converge costs a VM boot
      - task: lint
      - '{{.MOLECULE_ENV}} molecule test --all'

  converge:
    desc: 'Run molecule converge (args after --: task converge -- -s upgrade)'
    deps: [venv]
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - '{{.MOLECULE_ENV}} molecule converge {{.CLI_ARGS}}'

  verify:
    desc: Run molecule verify
    deps: [venv]
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - '{{.MOLECULE_ENV}} molecule verify {{.CLI_ARGS}}'

  login:
    desc: 'Open a shell on a converged instance: task login -- -h debian-13'
    deps: [venv]
    dir: '{{.USER_WORKING_DIR}}'
    # molecule login hands over a tty, which task captures unless told not to;
    # without this the shell comes up unusable
    interactive: true
    cmds:
      # the host is only optional while the scenario has a single instance;
      # 'molecule login' lists the names when the choice is ambiguous
      - '{{.MOLECULE_ENV}} molecule login {{.CLI_ARGS}}'

  destroy:
    desc: Destroy molecule instances
    deps: [venv]
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - '{{.MOLECULE_ENV}} molecule destroy {{.CLI_ARGS}}'

  molecule:
    desc: 'Run an arbitrary molecule command: task molecule -- list'
    deps: [venv]
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - '{{.MOLECULE_ENV}} molecule {{.CLI_ARGS}}'
