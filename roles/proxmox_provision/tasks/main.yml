---

- name: Comment out apt repos that require a subscription
  ansible.builtin.replace:
    path: "{{ _proxmox_provision_apt_repo }}"
    regexp: "^deb https"
    replace: "#deb https"
  loop:
    - /etc/apt/sources.list.d/pve-enterprise.list
    - /etc/apt/sources.list.d/ceph.list
  loop_control:
    loop_var: _proxmox_provision_apt_repo
  become: true
  when: proxmox_provision_apt_repos | bool
  notify: Update apt packages

- name: Add public repo with no subscription
  ansible.builtin.copy:
    content: |
      deb http://download.proxmox.com/debian/pve bookworm pve-no-subscription
    dest: /etc/apt/sources.list.d/pve-no-subscription.list
    mode: "0644"
  become: true
  when: proxmox_provision_apt_repos | bool
  notify: Update apt packages

- name: Remove "You do not have a valid subscription for this server" message
  ansible.builtin.replace:
    path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
    regexp: "{{ _poxmox_provision_replace_regexp }}"
    replace: "(false)"
    backup: true
  loop:
    - "\\(res === null[\\s\\S]*?\\.data\\.status\\.toLowerCase\\(\\) \\!== 'active'\\)"
    - "\\(\\!res [\\s\\S]*?\\.data\\.status\\.toLowerCase\\(\\) \\!== 'active'\\)"
    # new version with extra newlines
    - "\\(\\n[ \\t]*?res === null[\\s\\S]*?\\.data\\.status\\.toLowerCase\\(\\) \\!== 'active'\\n[ \\t]*?\\)"
    - "\\(\\n[ \\t]*?\\!res [\\s\\S]*?\\.data\\.status\\.toLowerCase\\(\\) \\!== 'active'\\n[ \\t]*?\\)"
  loop_control:
    loop_var: _poxmox_provision_replace_regexp
  become: true
  when: proxmox_provision_subscription_msg | bool
  notify: Restart pveproxy service

- name: Copy Web UI SSL certificate
  ansible.builtin.copy:
    src: "{{ proxmox_provision_web_ui_cert }}"
    dest: /etc/pve/local/pve-ssl.pem
    owner: root
    group: www-data
    mode: "0640"
  become: true
  when: proxmox_provision_certificate | bool
  notify: Restart pveproxy service

- name: Copy Web UI SSL certificate key
  ansible.builtin.copy:
    src: "{{ proxmox_provision_web_ui_cert_key }}"
    dest: /etc/pve/local/pve-ssl.key
    owner: root
    group: www-data
    mode: "0640"
  become: true
  when: proxmox_provision_certificate | bool
  notify: Restart pveproxy service

# pvebanner.service rewrites /etc/issue every boot; agetty prints /etc/issue
# then each /etc/issue.d/*.issue, so we add our line there and leave /etc/issue
# (and pvebanner) alone. No handler: agetty re-reads the files at every prompt.
- name: Ensure /etc/issue.d exists
  ansible.builtin.file:
    path: /etc/issue.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Add Web UI address to the console banner
  ansible.builtin.template:
    src: etc_issue.d_50-custom.issue.j2
    dest: /etc/issue.d/50-custom.issue
    owner: root
    group: root
    mode: "0644"
  become: true
