---

- name: Check host and parameters
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Debian'
      - ansible_facts['distribution_major_version'] | int >= 13
      - not proxmox_provision_certificate | bool or proxmox_provision_web_ui_cert != ""
      - not proxmox_provision_certificate | bool or proxmox_provision_web_ui_cert_key != ""
    fail_msg: >-
      Requires Proxmox VE 9+ (Debian 13+), and proxmox_provision_web_ui_cert/_key
      when proxmox_provision_certificate is true

# Plain copy instead of deb822_repository: that module needs python3-debian
# (installing it needs a working 'apt update', which the enabled enterprise repo
# breaks with a 401), fails in check mode without it, and rewrites files in its
# own field order.

# Leftovers of the PVE 8 install and of earlier versions of this role
- name: Remove one-line apt sources
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ _proxmox_provision_apt_list }}"
    state: absent
  loop:
    - pve-enterprise.list
    - pve-no-subscription.list
    - ceph.list
    - pve-enterprise.sources.dpkg-old
  loop_control:
    loop_var: _proxmox_provision_apt_list
  become: true
  when: proxmox_provision_apt_repos | bool
  notify: Update apt packages

# pve-manager conffile: accepting the maintainer's version on upgrade re-enables
# it, re-running the role disables it again
- name: Disable enterprise repo that requires a subscription
  ansible.builtin.copy:
    content: |
      # Generated by Ansible. Any local changes will be overwritten
      Types: deb
      URIs: https://enterprise.proxmox.com/debian/pve
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: pve-enterprise
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
      Enabled: false
    dest: /etc/apt/sources.list.d/pve-enterprise.sources
    owner: root
    group: root
    mode: "0644"
  become: true
  when: proxmox_provision_apt_repos | bool
  notify: Update apt packages

- name: Add public repo with no subscription
  ansible.builtin.copy:
    content: |
      # Generated by Ansible. Any local changes will be overwritten
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    dest: /etc/apt/sources.list.d/pve-no-subscription.sources
    owner: root
    group: root
    mode: "0644"
  become: true
  when: proxmox_provision_apt_repos | bool
  notify: Update apt packages

- name: Add Debian repos
  ansible.builtin.copy:
    content: |
      # Generated by Ansible. Any local changes will be overwritten
      Types: deb
      URIs: {{ proxmox_provision_debian_mirror }}
      Suites: {{ ansible_facts['distribution_release'] }} {{ ansible_facts['distribution_release'] }}-updates
      Components: main contrib non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg

      Types: deb
      URIs: http://security.debian.org/debian-security
      Suites: {{ ansible_facts['distribution_release'] }}-security
      Components: main contrib non-free-firmware
      Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
    dest: /etc/apt/sources.list.d/debian.sources
    owner: root
    group: root
    mode: "0644"
  become: true
  when: proxmox_provision_apt_repos | bool
  notify: Update apt packages

- name: Empty one-line Debian sources.list
  ansible.builtin.copy:
    content: |
      # Generated by Ansible. Any local changes will be overwritten
      # Repos are configured in /etc/apt/sources.list.d/*.sources
    dest: /etc/apt/sources.list
    owner: root
    group: root
    mode: "0644"
  become: true
  when: proxmox_provision_apt_repos | bool
  notify: Update apt packages

- name: Update apt cache before continuing
  ansible.builtin.meta: flush_handlers

- name: Remove "You do not have a valid subscription for this server" message
  ansible.builtin.replace:
    path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
    regexp: "{{ _proxmox_provision_replace_regexp }}"
    replace: "(false)"
    backup: true
  loop:
    - "\\(res === null[\\s\\S]*?\\.data\\.status\\.toLowerCase\\(\\) \\!== 'active'\\)"
    - "\\(\\!res [\\s\\S]*?\\.data\\.status\\.toLowerCase\\(\\) \\!== 'active'\\)"
    # new version with extra newlines
    - "\\(\\n[ \\t]*?res === null[\\s\\S]*?\\.data\\.status\\.toLowerCase\\(\\) \\!== 'active'\\n[ \\t]*?\\)"
    - "\\(\\n[ \\t]*?\\!res [\\s\\S]*?\\.data\\.status\\.toLowerCase\\(\\) \\!== 'active'\\n[ \\t]*?\\)"
  loop_control:
    loop_var: _proxmox_provision_replace_regexp
  become: true
  when: proxmox_provision_subscription_msg | bool
  notify: Restart pveproxy service

- name: Copy Web UI SSL certificate
  ansible.builtin.copy:
    src: "{{ proxmox_provision_web_ui_cert }}"
    dest: /etc/pve/local/pve-ssl.pem
    owner: root
    group: www-data
    mode: "0640"
  become: true
  when: proxmox_provision_certificate | bool
  notify: Restart pveproxy service

- name: Copy Web UI SSL certificate key
  ansible.builtin.copy:
    src: "{{ proxmox_provision_web_ui_cert_key }}"
    dest: /etc/pve/local/pve-ssl.key
    owner: root
    group: www-data
    mode: "0640"
  become: true
  when: proxmox_provision_certificate | bool
  notify: Restart pveproxy service

# pvebanner.service rewrites /etc/issue every boot; agetty prints /etc/issue
# then each /etc/issue.d/*.issue, so we add our line there and leave /etc/issue
# (and pvebanner) alone. No handler: agetty re-reads the files at every prompt.
- name: Ensure /etc/issue.d exists
  ansible.builtin.file:
    path: /etc/issue.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Add Web UI address to the console banner
  ansible.builtin.template:
    src: etc_issue.d_50-custom.issue.j2
    dest: /etc/issue.d/50-custom.issue
    owner: root
    group: root
    mode: "0644"
  become: true
