---

# Platforms override the shared base config wholesale: five monitored
# instances plus a disposable Zabbix stack (db + server + web) that the
# role's API tasks require. All containers share one docker network and
# reach each other by container name.

platforms:
  - name: mon-debian-11
    image: docker.io/geerlingguy/docker-debian11-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    networks:
      - name: molecule-zbx-monitored
    groups:
      - monitored
  - name: mon-debian-12
    image: docker.io/geerlingguy/docker-debian12-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    networks:
      - name: molecule-zbx-monitored
    groups:
      - monitored
  - name: mon-debian-13
    image: docker.io/geerlingguy/docker-debian13-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    networks:
      - name: molecule-zbx-monitored
    groups:
      - monitored
  - name: mon-ubuntu-22.04
    image: docker.io/geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    networks:
      - name: molecule-zbx-monitored
    groups:
      - monitored
  - name: mon-ubuntu-24.04
    image: docker.io/geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    privileged: true
    networks:
      - name: molecule-zbx-monitored
    groups:
      - monitored

  # --- disposable Zabbix stack (not converge targets) ------------------------
  - name: zbx-db
    image: docker.io/library/postgres:16-alpine
    pre_build_image: true
    override_command: false
    env:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
    networks:
      - name: molecule-zbx-monitored
    groups:
      - infra
  - name: zbx-server
    image: docker.io/zabbix/zabbix-server-pgsql:ubuntu-latest
    pre_build_image: true
    override_command: false
    env:
      DB_SERVER_HOST: zbx-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
    networks:
      - name: molecule-zbx-monitored
    groups:
      - infra
  - name: zbx-web
    image: docker.io/zabbix/zabbix-web-nginx-pgsql:ubuntu-latest
    pre_build_image: true
    override_command: false
    env:
      DB_SERVER_HOST: zbx-db
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      ZBX_SERVER_HOST: zbx-server
    published_ports:
      - 127.0.0.1:18080:8080
    networks:
      - name: molecule-zbx-monitored
    groups:
      - infra

provisioner:
  inventory:
    group_vars:
      # API endpoint as seen from the control host (the published zbx-web port),
      # set once for the whole group the way a production inventory would. The
      # role applies these as connection variables on its API tasks only, so
      # localhost stays a plain local connection for everything else.
      monitored:
        zabbix_monitored_host_api_server: 127.0.0.1
        zabbix_monitored_host_api_port: 18080
        zabbix_monitored_host_api_use_ssl: false
        zabbix_monitored_host_api_url_path: ''
        zabbix_monitored_host_api_user: Admin
        zabbix_monitored_host_api_password: zabbix
