---

- name: Converge
  hosts: monitored
  vars:
    zabbix_monitored_host_server: zbx-server
    zabbix_monitored_host_groups:
      - Molecule test
    zabbix_monitored_host_scheduled_tasks:
      - name: Molecule OK job
        key: molecule_ok
        exec_start: /bin/true
        timer_on_calendar: "*-*-* 03:00:00"
        no_run_threshold: 2d
      - name: Molecule failing job
        key: molecule_fail
        exec_start: /bin/false
        timer_on_calendar: "*-*-* 03:30:00"
        no_run_threshold: 2d
        failed_severity: average
  roles:
    - zabbix-monitored-host
