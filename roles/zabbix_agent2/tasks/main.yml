---
# tasks file for zabbix_agent2

- name: Add Zabbix repository GPG key
  ansible.builtin.get_url:
    url: "https://repo.zabbix.com/zabbix-official-repo.key"
    dest: /etc/apt/keyrings/zabbix.asc
    mode: "0644"
  become: true

# deb822_repository needs python3-debian on the target or it errors out. gnupg is
# NOT needed: apt verifies a Signed-By keyring with gpgv (base) / sqv (trixie),
# never the full gnupg suite - that was only required by the old apt-key flow.
- name: Install python3-debian
  ansible.builtin.apt:
    name: ["python3-debian"]
    update_cache: true
    cache_valid_time: "{{ '1d' | community.general.to_seconds | int }}"
    lock_timeout: "{{ '15m' | community.general.to_seconds | int }}"
  become: true

# Migration cleanup: drop the globally-trusted key earlier versions of this role
# placed into /etc/apt/trusted.gpg.d (superseded by the scoped keyring above).
- name: Remove legacy globally-trusted Zabbix key
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d/zabbix-keyring.asc
    state: absent
  become: true

- name: Find legacy one-line Zabbix apt sources
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "repo_zabbix_com_zabbix_*.list"
  register: __zabbix_agent2_legacy_lists
  become: true

- name: Delete legacy one-line Zabbix apt sources
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ __zabbix_agent2_legacy_lists.files }}"
  loop_control:
    label: "{{ item.path }}"
  become: true

- name: Add Zabbix APT repository
  ansible.builtin.deb822_repository:
    name: zabbix
    types: [deb]
    uris: "https://repo.zabbix.com/zabbix/{{ zabbix_agent2_version }}/stable/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: [main]
    signed_by: /etc/apt/keyrings/zabbix.asc
    state: present
  become: true
  notify: Update apt cache

# deb822_repository deliberately has no update_cache option
- name: Index the new repository before installing
  ansible.builtin.meta: flush_handlers

- name: Install zabbix-agent2 apt package
  ansible.builtin.apt:
    name: ["zabbix-agent2"]
    update_cache: true
    cache_valid_time: "{{ '1d' | community.general.to_seconds | int }}"
    lock_timeout: "{{ '15m' | community.general.to_seconds | int }}"
  become: true

- name: Add zabbix user to docker group
  ansible.builtin.user:
    name: zabbix
    groups: docker
    append: true
  become: true
  when: zabbix_agent2_docker_enabled
  notify: Restart zabbix-agent2 service

- name: Deploy zabbix-agent2 configuration override
  ansible.builtin.template:
    src: 00-ansible.conf.j2
    dest: /etc/zabbix/zabbix_agent2.d/00-ansible.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart zabbix-agent2 service

- name: Make sure /etc/sudoers.d exists
  ansible.builtin.file:
    state: directory
    path: /etc/sudoers.d
    owner: root
    group: root
    mode: "0750"
  become: true
  when: zabbix_agent2_smart_enabled

- name: Add sudoers file for zabbix user (smartctl access)
  ansible.builtin.copy:
    content: "zabbix ALL=(ALL) NOPASSWD:/usr/sbin/smartctl"
    dest: /etc/sudoers.d/zabbix-smartctl
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  become: true
  when: zabbix_agent2_smart_enabled
