---

# Driver, platforms and test sequence come from the shared base config
# (.config/molecule/config.yml at the repo root). This scenario runs the role
# with its default options (all optional features off) across the whole matrix,
# so it covers the baseline install path and, via the biconditional asserts in
# verify.yml, the "feature off => no trace" negative case. The all-options
# combination is covered by the sibling 'full' scenario.

driver:
  name: docker
