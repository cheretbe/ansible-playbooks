---

- name: Converge
  hosts: all
  gather_facts: true
  tasks:
    - name: Set up the additional filesystems
      ansible.builtin.include_role:
        name: linux_additional_filesystems
      vars:
        linux_additional_filesystems_devices:
          # Numeric GB -> matched against ansible_facts.devices size "1.00 GB" / "2.00 GB"
          - disk_size: 1
            fstype: ext4
            mount_point: /mnt/data
          - disk_size: 2
            fstype: ext4
            mount_point: /mnt/other
          # Explicit MB string -> the loop device (/dev/loopN -> loopNp1 branch)
          - disk_size: "50.00 MB"
            fstype: ext4
            mount_point: /mnt/loopdata
