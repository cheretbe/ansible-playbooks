---

- name: Converge
  hosts: all
  gather_facts: true
  vars:
    # Exercise the optional inputs of the included roles; the corresponding
    # outcomes are checked in verify.yml. Defaults (locale, timezone, motd
    # scripts, unattended upgrades, dns stub, package set) are left as is.
    linux_ca_certificate_files:
      - src: "{{ playbook_dir }}/files/molecule-test-ca.crt"
        dst_file_name: molecule-test-ca.crt
    linux_mta_root_mail_recipient: molecule-root@example.com
    linux_mta_aliases:
      - "moleculealias: root"
    linux_motd_custom_message: "[bold green]Provisioned by molecule[/]"
    linux_users_list:
      - name: moleculetest
        comment: Molecule test user
        # mkpasswd -m sha512crypt 'molecule-test-password'
        password: "$6$ZxEMxMuBsBBY6Q4y$EUXki4GfTzUm6ornVLVHqbpuHANHbRCAnP7e0kUVupVcuNuuPpfeDVJ3ZWFLQFGkuP8BkmyBcbrpRFXooW.1O."
        shell: /bin/bash
        groups: sudo
        # throwaway keypair generated for this test, private key discarded
        ssh_authorized_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINzx8kFNe2ZJ3N+HxnXm92iPQvqLAAlkYGckutCjYnte moleculetest"
  tasks:
    - name: Import linux-provision role
      ansible.builtin.import_role:
        name: linux-provision
