---

driver:
  name: vagrant
platforms:
  # change_host_name in VagrantPlugins::ProviderVirtualBox::Provider correctly sets FQDN in /etc/hosts when
  # host.domain.tld name format is used
  #
  # vm.boot_timeout is raised from the default 300s: booting five VMs at once
  # can push SSH availability past the default on a loaded host
  - name: debian-11.local.test
    box: debian/bullseye64
    config_options:
      vm.boot_timeout: 900
  - name: debian-12.local.test
    box: debian/bookworm64
    config_options:
      vm.boot_timeout: 900
  # Debian publishes trixie boxes for libvirt only (no virtualbox provider),
  # so debian 13 uses a bento box
  - name: debian-13.local.test
    box: bento/debian-13
    config_options:
      vm.boot_timeout: 900
  - name: ubuntu-22.04.local.test
    box: ubuntu/jammy64
    config_options:
      vm.boot_timeout: 900
  # Canonical will no longer publish Vagrant images directly starting with Ubuntu 24.04 LTS (Noble Numbat)
  # https://documentation.ubuntu.com/public-images/en/latest/public-images-explanation/vagrant/#support
  # https://github.com/chef/bento
  - name: ubuntu-24.04.local.test
    box: bento/ubuntu-24.04
    config_options:
      vm.boot_timeout: 900
