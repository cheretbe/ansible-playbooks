---

- name: Prepare
  hosts: all
  tasks:
    # bento boxes keep the image-build hostname in /etc/hosts (e.g.
    # "127.0.1.1 debian-13.1-amd64 debian-13"); such a line precedes the FQDN
    # entry added by vagrant and shadows it, breaking 'hostname -f'
    - name: Write /etc/hosts with the expected FQDN entry
      ansible.builtin.copy:
        content: |
          127.0.0.1 localhost
          127.0.1.1 {{ inventory_hostname }} {{ inventory_hostname.split('.') | first }}

          ::1     localhost ip6-localhost ip6-loopback
          ff02::1 ip6-allnodes
          ff02::2 ip6-allrouters
        dest: /etc/hosts
        owner: root
        group: root
        mode: "0644"
      become: true
    # boxes carry a debconf grub-pc/install_devices value from the image
    # build (a /dev/disk/by-id path with the build-time disk serial); on a
    # freshly created VM that device does not exist and the grub-pc postinst
    # fails during 'apt upgrade'. All VirtualBox VMs see their disk as
    # /dev/sda.
    - name: Preseed grub-pc install device
      ansible.builtin.debconf:
        name: grub-pc
        question: grub-pc/install_devices
        value: /dev/sda
        vtype: multiselect
      become: true

    # Debian 11 LTS ended on 2026-08-31: the last bullseye-security Release
    # file has expired permanently and the packages referenced by it are
    # being removed from the pool (404). Drop the dead repository; main and
    # bullseye-updates still work.
    - name: Remove retired bullseye-security repository on Debian 11
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list
        regexp: security\.debian\.org
        state: absent
      become: true
      when:
        - ansible_facts['distribution'] == "Debian"
        - ansible_facts['distribution_major_version'] == "11"

    # Remaining bullseye Release files are frozen and their Valid-Until
    # dates will eventually pass as well
    - name: Disable APT Release file validity check on Debian 11
      ansible.builtin.copy:
        content: |
          Acquire::Check-Valid-Until "false";
        dest: /etc/apt/apt.conf.d/99-molecule-no-check-valid-until
        owner: root
        group: root
        mode: "0644"
      become: true
      when:
        - ansible_facts['distribution'] == "Debian"
        - ansible_facts['distribution_major_version'] == "11"
