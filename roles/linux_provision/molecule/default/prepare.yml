---

- name: Prepare
  hosts: all
  tasks:
    # bento boxes keep the image-build hostname in /etc/hosts (e.g.
    # "127.0.1.1 debian-13.1-amd64 debian-13"); such a line precedes the FQDN
    # entry added by vagrant and shadows it, breaking 'hostname -f'
    - name: Write /etc/hosts with the expected FQDN entry
      ansible.builtin.copy:
        content: |
          127.0.0.1 localhost
          127.0.1.1 {{ inventory_hostname }} {{ inventory_hostname.split('.') | first }}

          ::1     localhost ip6-localhost ip6-loopback
          ff02::1 ip6-allnodes
          ff02::2 ip6-allrouters
        dest: /etc/hosts
        owner: root
        group: root
        mode: "0644"
      become: true
    # boxes carry a debconf grub-pc/install_devices value from the image
    # build (a /dev/disk/by-id path with the build-time disk serial); on a
    # freshly created VM that device does not exist and the grub-pc postinst
    # fails during 'apt upgrade'. All VirtualBox VMs see their disk as
    # /dev/sda.
    - name: Preseed grub-pc install device
      ansible.builtin.debconf:
        name: grub-pc
        question: grub-pc/install_devices
        value: /dev/sda
        vtype: multiselect
      become: true
