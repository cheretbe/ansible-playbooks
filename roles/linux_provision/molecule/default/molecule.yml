---

driver:
  name: vagrant
platforms:
  # change_host_name in VagrantPlugins::ProviderVirtualBox::Provider correctly sets FQDN in /etc/hosts when
  # host.domain.tld name format is used
  #
  # memory/cpus are set explicitly on every instance: the molecule vagrant
  # driver defaults to 512MB and 2 vCPUs (molecule_plugins/vagrant/modules/
  # vagrant.py), overriding whatever the box ships with. 512MB is enough for a
  # minimal Debian but not for Ubuntu, which wedges during boot instead of
  # failing - systemd-tmpfiles-setup.service runs with "no limit" while
  # sd-mkdcreds and systemd-networkd sit blocked in D state, so vagrant just
  # retries SSH until vm.boot_timeout expires and it looks like a role failure.
  # 2 vCPUs x 5 instances also oversubscribes a 6-core host for no benefit;
  # these VMs are IO-bound on apt, not CPU-bound.
  #
  # vm.boot_timeout is raised from the default 300s: booting five VMs at once
  # can push SSH availability past the default on a loaded host
  - name: debian-11.local.test
    box: debian/bullseye64
    memory: 1024
    cpus: 1
    config_options:
      vm.boot_timeout: 900
  - name: debian-12.local.test
    box: debian/bookworm64
    memory: 1024
    cpus: 1
    config_options:
      vm.boot_timeout: 900
  # Debian publishes trixie boxes for libvirt only (no virtualbox provider),
  # so debian 13 uses a bento box
  - name: debian-13.local.test
    box: bento/debian-13
    memory: 1024
    cpus: 1
    config_options:
      vm.boot_timeout: 900
  - name: ubuntu-22.04.local.test
    box: ubuntu/jammy64
    memory: 2048
    cpus: 1
    config_options:
      vm.boot_timeout: 900
  # Canonical will no longer publish Vagrant images directly starting with Ubuntu 24.04 LTS (Noble Numbat)
  # https://documentation.ubuntu.com/public-images/en/latest/public-images-explanation/vagrant/#support
  # https://github.com/chef/bento
  - name: ubuntu-24.04.local.test
    box: bento/ubuntu-24.04
    memory: 2048
    cpus: 1
    config_options:
      vm.boot_timeout: 900
