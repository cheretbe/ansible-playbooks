---

- name: Populate service facts
  ansible.builtin.service_facts:
  become: true

- name: Check if systemd-resolved service is present
  ansible.builtin.set_fact:
    _linux_provision_dns_has_resolved: true
  when: "'systemd-resolved.service' in ansible_facts.services"

- name: Check if systemd-resolved service is disabled
  ansible.builtin.set_fact:
    _linux_provision_dns_has_resolved: false
  when:
    - _linux_provision_dns_has_resolved | bool
    - ansible_facts.services["systemd-resolved.service"]["status"] != "enabled"

- name: Configure systemd-resolved
  when: _linux_provision_dns_has_resolved | bool
  block:
    - name: Get systemd version info
      # Disable 303: systemctl used in place of systemd module
      # systemd module doesn't expose version info
      ansible.builtin.command: systemctl --version  # noqa command-instead-of-module
      register: __linux_provision_dns_systemd_info
      changed_when: false

      # The first line carries the version, either bare ("systemd 237") or
      # followed by the package version in brackets, which is what Debian and
      # Ubuntu ship ("systemd 255 (255.4-1ubuntu8.17)"). Take the first run of
      # digits: splitting on the last space returns "(255.4-1ubuntu8.17)", and
      # '| int' silently turns that into 0.
    - name: Get systemd version
      ansible.builtin.set_fact:
        _linux_provision_dns_systemd_version: "{{ __linux_provision_dns_systemd_info.stdout_lines[0] | regex_search('[0-9]+') }}"

    # As of systemd 232 DNS stub listener can be disabled
    # https://www.freedesktop.org/software/systemd/man/resolved.conf.html
    - name: "Check if resolved DNS stub could be disabled"
      ansible.builtin.set_fact:
        _linux_provision_dns_disable_stub: true
      when: _linux_provision_dns_systemd_version | int >= 232

    - name: Make sure '/etc/systemd/resolved.conf.d' directory exists
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: "0755"
        owner: root
        group: root
      become: true
      when: _linux_provision_dns_disable_stub | bool

    - name: Disable systemd-resolved DNS stub
      ansible.builtin.copy:
        content: |
          # Generated by Ansible at {{ lookup('pipe', 'hostname -f') }}
          # Any changes made here will be overwritten
          [Resolve]
          DNSStubListener=no
        dest: /etc/systemd/resolved.conf.d/10-disable-dns-stub.conf
        mode: "0644"
      become: true
      when: _linux_provision_dns_disable_stub | bool
      register: __linux_provision_dns_stub_conf_info

      # A notification handler won't do: it might be called too late, after the
      # task files that follow this one have already run (and those might need
      # working DNS)
    - name: Restart systemd-resolved service  # noqa: no-handler
      ansible.builtin.service:
        name: systemd-resolved.service
        state: restarted
      become: true
      when: __linux_provision_dns_stub_conf_info.changed

    - name: "Get '/etc/resolv.conf' info"
      ansible.builtin.stat:
        path: /etc/resolv.conf
      register: __linux_provision_dns_resolv_conf_info

    - name: "Update '/etc/resolv.conf' symlink"
      ansible.builtin.file:
        src: "/run/systemd/resolve/resolv.conf"
        dest: "/etc/resolv.conf"
        state: link
      become: true
      when: >-
        __linux_provision_dns_resolv_conf_info.stat.islnk
        and
        __linux_provision_dns_resolv_conf_info.stat.lnk_source == "/run/systemd/resolve/stub-resolv.conf"
