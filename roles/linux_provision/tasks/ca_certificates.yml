---

- name: Make sure ca-certificates package is installed
  ansible.builtin.apt:
    name: ["ca-certificates"]
    update_cache: true
    cache_valid_time: "{{ '1d' | community.general.to_seconds | int }}"
    lock_timeout: "{{ '15m' | community.general.to_seconds | int }}"
  become: true

- name: Copy CA certificate files
  ansible.builtin.copy:
    src: "{{ _linux_provision_ca_certificates_cert_file.src }}"
    dest: "/usr/local/share/ca-certificates/{{ _linux_provision_ca_certificates_cert_file.dst_file_name }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ linux_provision_ca_certificate_files }}"
  loop_control:
    loop_var: _linux_provision_ca_certificates_cert_file
  become: true
  notify: update-ca-certificates

# The trust store has to be usable by the time the later task files run
- name: Flush handlers
  ansible.builtin.meta: flush_handlers
