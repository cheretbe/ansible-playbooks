---

- name: Prepare
  hosts: all
  tasks:
    # The test images ship with emptied apt lists but fresh cache timestamps,
    # so role tasks relying on cache_valid_time would see an empty index.
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      become: true

    - name: Create the Seafile account
      ansible.builtin.user:
        name: seafiletest
        comment: Molecule test user
        shell: /bin/bash
      become: true

    # Stands in for the account the zabbix-agent2 package creates, so the
    # sudoers rule can be exercised without installing the agent.
    - name: Create the zabbix account
      ansible.builtin.user:
        name: zabbix
        comment: Zabbix Monitoring System
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/zabbix
        create_home: false
      become: true

    # Two stale versions, so that pruning has something to both keep
    # (keep_versions defaults to 2) and remove.
    - name: Create stale version directories
      ansible.builtin.file:
        path: "/opt/seafile/seaf-cli-{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true
      loop:
        - "9.0.1"
        - "9.0.2"

    - name: Create stale version AppImages
      ansible.builtin.copy:
        content: "not a real AppImage\n"
        dest: "/opt/seafile/seaf-cli-{{ item }}.AppImage"
        owner: root
        group: root
        mode: "0755"
      become: true
      loop:
        - "9.0.1"
        - "9.0.2"
