---
# handlers file for linux_seafile_cli
#
# Handlers run in the order they are defined here, not in notification order,
# so the reload has to come first.

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

# Mandatory after a version swap: the symlink the unit points at has changed,
# but the running daemon still executes the old tree.
- name: Restart seafile client
  ansible.builtin.systemd:
    name: "{{ linux_seafile_cli_service_name }}"
    state: restarted
  become: true

# Re-reads the UserParameter drop-ins without a restart. Only meaningful while
# the agent runs: '-R' connects to the live process and fails otherwise.
- name: Reload zabbix-agent2 user parameters
  ansible.builtin.command: /usr/sbin/zabbix_agent2 -R userparameter_reload
  become: true
  changed_when: true
  when: _linux_seafile_cli_agent2_active.rc == 0
