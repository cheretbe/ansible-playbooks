---
# tasks file for zabbix_monitored_host

- name: Validate monitoring path
  ansible.builtin.assert:
    that:
      - _zabbix_monitored_host_sender_target | length > 0
    fail_msg: >-
      {{ 'zabbix_monitored_host_proxy is set, so zabbix_monitored_host_proxy_address
      is required'
      if zabbix_monitored_host_proxy | length > 0
      else 'zabbix_monitored_host_server is required' }}.

- name: Validate host groups
  ansible.builtin.assert:
    that:
      - zabbix_monitored_host_combined_groups | length > 0
    fail_msg: >-
      A Zabbix host must belong to at least one host group. Set
      zabbix_monitored_host_groups and/or zabbix_monitored_host_extra_groups.

- name: Validate Zabbix API connection settings
  ansible.builtin.assert:
    that:
      - zabbix_monitored_host_api_server | length > 0
      - >-
        (zabbix_monitored_host_api_token | length > 0)
        or (zabbix_monitored_host_api_user | length > 0
            and zabbix_monitored_host_api_password | length > 0)
    fail_msg: >-
      Set zabbix_monitored_host_api_server (defaults to
      zabbix_monitored_host_server) plus either
      zabbix_monitored_host_api_token or zabbix_monitored_host_api_user and
      zabbix_monitored_host_api_password.

# Runs on the control host over the httpapi connection declared below, built
# from the zabbix_monitored_host_api_* variables.
- name: Manage Zabbix host object
  delegate_to: "{{ zabbix_monitored_host_api_delegate }}"
  # A network connection (ansible_network_os) delegated elsewhere resolves its
  # ansible_* connection vars in the DELEGATE's scope, which sees this role's
  # defaults but NOT this host's inventory (group/host) vars. Read each value
  # from hostvars (inventory overrides) and fall back to the bare default, the
  # same way defaults/main.yml reaches this host's vars for the trapper hosts.
  vars:
    ansible_connection: httpapi
    ansible_network_os: community.zabbix.zabbix
    ansible_host: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_server | default(zabbix_monitored_host_api_server) }}"
    ansible_httpapi_port: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_port | default(zabbix_monitored_host_api_port) }}"
    ansible_httpapi_use_ssl: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_use_ssl | default(zabbix_monitored_host_api_use_ssl) }}"
    ansible_httpapi_validate_certs: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_validate_certs | default(zabbix_monitored_host_api_validate_certs) }}"
    ansible_zabbix_url_path: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_url_path | default(zabbix_monitored_host_api_url_path) }}"
    # Empty key -> the connection plugin logs in with user/password instead.
    ansible_zabbix_auth_key: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_token | default(zabbix_monitored_host_api_token) }}"
    ansible_user: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_user | default(zabbix_monitored_host_api_user) }}"
    ansible_httpapi_pass: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_password | default(zabbix_monitored_host_api_password) }}"
    # httpapi modules always execute on the control node, so use the same
    # interpreter as ansible-playbook, where community.zabbix is installed.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  block:
    # zabbix_host treats link_templates as the complete list and unlinks and
    # clears (items, triggers, history) any other template, e.g. one linked by
    # hand. Refuse that unless explicitly allowed.
    - name: Get existing Zabbix host object
      community.zabbix.zabbix_host_info:
        host_name: "{{ zabbix_monitored_host_name }}"
        # the default is a substring search
        exact_match: true
      register: __zabbix_monitored_host_existing
      # a host that does not exist yet has no templates to lose
      failed_when: >-
        __zabbix_monitored_host_existing.failed
        and 'Host not found' not in (__zabbix_monitored_host_existing.msg | default(''))
      when: not zabbix_monitored_host_allow_template_deletion

    # Compare by visible name: parentTemplates carries only that (no ID), while
    # link_templates holds technical names. The export is the only place this
    # module returns a template's visible name; Zabbix keeps those unique.
    - name: Resolve requested template names
      community.zabbix.zabbix_template_info:
        template_name: "{{ item }}"
        format: json
        omit_date: true
      register: __zabbix_monitored_host_templates
      loop: "{{ zabbix_monitored_host_combined_templates }}"
      when:
        - not zabbix_monitored_host_allow_template_deletion
        - __zabbix_monitored_host_existing.hosts is defined

    - name: Check that no linked templates would be removed
      ansible.builtin.assert:
        that:
          - _zabbix_monitored_host_dropped_templates | length == 0
        fail_msg: >-
          Zabbix host {{ zabbix_monitored_host_name }} has templates linked
          that are not in the role's template list and would be unlinked and
          cleared: {{ _zabbix_monitored_host_dropped_templates | map(attribute='name') | join(', ') }}.
          Add them to zabbix_monitored_host_templates or
          zabbix_monitored_host_extra_templates, or set
          zabbix_monitored_host_allow_template_deletion to true.
        quiet: true
      vars:
        _zabbix_monitored_host_dropped_templates: >-
          {{ __zabbix_monitored_host_existing.hosts[0].parentTemplates
             | rejectattr('name', 'in',
                          __zabbix_monitored_host_templates.results | default([])
                          | map(attribute='template_json.zabbix_export.templates.0.name')
                          | list)
             | list }}
      when:
        - not zabbix_monitored_host_allow_template_deletion
        - __zabbix_monitored_host_existing.hosts is defined

    - name: Create/update Zabbix host object
      community.zabbix.zabbix_host:
        host_name: "{{ zabbix_monitored_host_name }}"
        visible_name: "{{ zabbix_monitored_host_visible_name }}"
        host_groups: "{{ zabbix_monitored_host_combined_groups }}"
        link_templates: "{{ zabbix_monitored_host_combined_templates }}"
        status: "{{ zabbix_monitored_host_status }}"
        monitored_by: "{{ _zabbix_monitored_host_monitored_by }}"
        proxy: "{{ zabbix_monitored_host_proxy | default(omit, true) }}"
        interfaces: "{{ zabbix_monitored_host_interfaces }}"
        state: present

- name: Configure Linux target
  ansible.builtin.include_tasks: linux.yml
  when: ansible_facts['os_family'] != 'Windows'

- name: Configure Windows target
  ansible.builtin.include_tasks: windows.yml
  when: ansible_facts['os_family'] == 'Windows'
