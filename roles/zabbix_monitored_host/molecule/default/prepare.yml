---

- name: Prepare monitored hosts
  hosts: monitored
  vars:
    zabbix_agent2_server: zbx-server
    zabbix_agent2_version: >-
      {{ lookup('env', 'TEST_ZABBIX_VERSION') | default('7.4', true) }}
  tasks:
    # The test images ship with emptied apt lists but fresh cache timestamps,
    # so role tasks relying on cache_valid_time would see an empty index.
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      become: true

    # Provides the Zabbix apt repository (the role's zabbix-sender install
    # needs it) and mirrors how production monitored hosts actually look.
    - name: Install Zabbix agent
      ansible.builtin.include_role:
        name: zabbix_agent2

    - name: Wait for the Zabbix API to come up
      ansible.builtin.uri:
        url: http://zbx-web:8080/api_jsonrpc.php
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: apiinfo.version
          params: {}
          id: 1
        return_content: true
      register: zabbix_monitored_host_api_check
      until: zabbix_monitored_host_api_check.json.result is defined
      retries: 60
      delay: 5
      run_once: true

    - name: Create the test host group
      community.zabbix.zabbix_group:
        host_groups:
          - Molecule test
        state: present
      delegate_to: localhost
      run_once: true
      # A network connection (ansible_network_os) delegated to localhost resolves
      # its ansible_* connection vars in the DELEGATE's scope, where the
      # monitored group's group_vars are not visible. Reach the real host's vars
      # via hostvars, the same way defaults/main.yml does for the trapper hosts.
      vars:
        ansible_connection: httpapi
        ansible_network_os: community.zabbix.zabbix
        ansible_host: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_server }}"
        ansible_httpapi_port: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_port }}"
        ansible_httpapi_use_ssl: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_use_ssl }}"
        ansible_zabbix_url_path: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_url_path }}"
        ansible_user: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_user }}"
        ansible_httpapi_pass: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_password }}"
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
