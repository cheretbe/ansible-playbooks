---

- name: Verify
  hosts: monitored
  vars:
    zabbix_monitored_host_verify_api_url: http://zbx-web:8080/api_jsonrpc.php
    zabbix_monitored_host_verify_jobs:
      - key: molecule_ok
        expected_exit: "0"
      - key: molecule_fail
        expected_exit: "1"
  tasks:
    # --- on-host artifacts ----------------------------------------------------
    - name: Stat job unit files
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item.0.key }}.{{ item.1 }}"
      loop: "{{ zabbix_monitored_host_verify_jobs | product(['service', 'timer']) | list }}"
      loop_control:
        label: "{{ item.0.key }}.{{ item.1 }}"
      register: zabbix_monitored_host_verify_units

    - name: Check that unit files exist
      ansible.builtin.assert:
        that: item.stat.exists
      loop: "{{ zabbix_monitored_host_verify_units.results }}"
      loop_control:
        label: "{{ item.stat.path }}"

    - name: Check that timers are enabled and active
      # service_facts can't verify timers: its systemd collector runs
      # `systemctl list-units --type service`, so .timer units never appear
      ansible.builtin.command: "systemctl is-{{ item.1 }} {{ item.0.key }}.timer"  # noqa: command-instead-of-module
      changed_when: false
      register: zabbix_monitored_host_verify_timers
      failed_when: zabbix_monitored_host_verify_timers.stdout not in ['enabled', 'active']
      loop: "{{ zabbix_monitored_host_verify_jobs | product(['enabled', 'active']) | list }}"
      loop_control:
        label: "{{ item.0.key }}.timer is-{{ item.1 }}"

    # --- Zabbix host object ----------------------------------------------------
    - name: Get Zabbix host object
      community.zabbix.zabbix_host_info:
        host_name: "{{ inventory_hostname }}"
      delegate_to: localhost
      register: zabbix_monitored_host_verify_host
      # Delegated network connection resolves its ansible_* vars in localhost's
      # scope, where the monitored group_vars are invisible; reach them via
      # hostvars (see prepare.yml and defaults/main.yml for the same pattern).
      vars: &zabbix_monitored_host_verify_api_vars
        ansible_connection: httpapi
        ansible_network_os: community.zabbix.zabbix
        ansible_host: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_server }}"
        ansible_httpapi_port: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_port }}"
        ansible_httpapi_use_ssl: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_use_ssl }}"
        ansible_zabbix_url_path: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_url_path }}"
        ansible_user: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_user }}"
        ansible_httpapi_pass: "{{ hostvars[inventory_hostname].zabbix_monitored_host_api_password }}"
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: Check host object and group membership
      ansible.builtin.assert:
        that:
          - zabbix_monitored_host_verify_host.hosts | length == 1
          - >-
            'Molecule test' in
            (zabbix_monitored_host_verify_host.hosts[0].hostgroups | map(attribute='name'))

    # --- end to end: run the jobs, expect exit values in Zabbix ----------------
    - name: Run monitored jobs now
      ansible.builtin.systemd:
        name: "{{ item.key }}.service"
        state: started
      become: true
      # the failing job's unit is supposed to end up in a failed state
      failed_when: false
      loop: "{{ zabbix_monitored_host_verify_jobs }}"
      loop_control:
        label: "{{ item.key }}.service"

    - name: Log in to the Zabbix API
      ansible.builtin.uri:
        url: "{{ zabbix_monitored_host_verify_api_url }}"
        method: POST
        body_format: json
        body:
          jsonrpc: "2.0"
          method: user.login
          params:
            username: Admin
            password: zabbix
          id: 1
      register: zabbix_monitored_host_verify_login
      run_once: true

    - name: Check that job exit values arrived in Zabbix
      ansible.builtin.uri:
        url: "{{ zabbix_monitored_host_verify_api_url }}"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_monitored_host_verify_login.json.result }}"
        body:
          jsonrpc: "2.0"
          method: item.get
          params:
            host: "{{ inventory_hostname }}"
            search:
              key_: "job.exit[{{ item.key }}]"
            output: ["key_", "lastvalue", "lastclock"]
          id: 2
      register: zabbix_monitored_host_verify_item
      until:
        - zabbix_monitored_host_verify_item.json.result | default([]) | length == 1
        - zabbix_monitored_host_verify_item.json.result[0].lastclock | default(0) | int > 0
        - zabbix_monitored_host_verify_item.json.result[0].lastvalue == item.expected_exit
      retries: 20
      delay: 3
      loop: "{{ zabbix_monitored_host_verify_jobs }}"
      loop_control:
        label: "job.exit[{{ item.key }}]"

    - name: Get job triggers
      ansible.builtin.uri:
        url: "{{ zabbix_monitored_host_verify_api_url }}"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ zabbix_monitored_host_verify_login.json.result }}"
        body:
          jsonrpc: "2.0"
          method: trigger.get
          params:
            host: "{{ inventory_hostname }}"
            output: ["description"]
          id: 3
      register: zabbix_monitored_host_verify_triggers

    - name: Check that both triggers exist per job
      ansible.builtin.assert:
        # a "failed" and a "did not run" trigger for each job
        that: >-
          zabbix_monitored_host_verify_triggers.json.result | default([]) | length
          == (zabbix_monitored_host_verify_jobs | length) * 2

    # --- template safeguard ----------------------------------------------------
    # Relinks templates on the host object.
    - name: Link an extra template by hand
      community.zabbix.zabbix_host:
        host_name: "{{ inventory_hostname }}"
        link_templates:
          - ICMP Ping
        # merge with the existing templates instead of replacing them
        force: false
      delegate_to: localhost
      vars: *zabbix_monitored_host_verify_api_vars

    - name: Run the role against a host with an unlisted template
      block:
        - name: Apply zabbix_monitored_host
          ansible.builtin.include_role:
            name: zabbix_monitored_host
            # ansible_failed_result carries the role's unrendered delegated
            # connection vars, which fall back to role defaults; keep those
            # defined for the rescue
            public: true

        - name: Fail if the role did not refuse to unlink the template
          ansible.builtin.fail:
            msg: zabbix_monitored_host unlinked a template it was not told about
      rescue:
        - name: Check that the role failed on the template safeguard
          ansible.builtin.assert:
            that:
              - "'ICMP Ping' in ansible_failed_result.msg"
              - "'zabbix_monitored_host_allow_template_deletion' in ansible_failed_result.msg"

    - name: Apply zabbix_monitored_host with template deletion allowed
      ansible.builtin.include_role:
        name: zabbix_monitored_host
      vars:
        zabbix_monitored_host_allow_template_deletion: true

    - name: Get Zabbix host object after template deletion
      community.zabbix.zabbix_host_info:
        host_name: "{{ inventory_hostname }}"
        exact_match: true
      delegate_to: localhost
      register: zabbix_monitored_host_verify_host_after
      vars: *zabbix_monitored_host_verify_api_vars

    - name: Check that the extra template was unlinked
      ansible.builtin.assert:
        that:
          - zabbix_monitored_host_verify_host_after.hosts[0].parentTemplates | length == 0

    # --- proxy ---------------------------------------------------------------
    # A proxy object is enough to assign hosts to; nothing has to run behind it.
    - name: Create a test proxy object
      community.zabbix.zabbix_proxy:
        proxy_name: molecule-proxy
        operating_mode: active
        state: present
      delegate_to: localhost
      run_once: true
      vars: *zabbix_monitored_host_verify_api_vars

    - name: Run the role with a proxy but no proxy address
      block:
        - name: Apply zabbix_monitored_host
          ansible.builtin.include_role:
            name: zabbix_monitored_host
          vars:
            zabbix_monitored_host_proxy: molecule-proxy

        - name: Fail if the role accepted a proxy without an address
          ansible.builtin.fail:
            msg: zabbix_monitored_host accepted a proxy without zabbix_monitored_host_proxy_address
      rescue:
        - name: Check that the role failed on the proxy address check
          ansible.builtin.assert:
            that:
              - "'zabbix_monitored_host_proxy_address' in ansible_failed_result.msg"

    - name: Apply zabbix_monitored_host behind the proxy
      ansible.builtin.include_role:
        name: zabbix_monitored_host
      vars:
        zabbix_monitored_host_proxy: molecule-proxy
        zabbix_monitored_host_proxy_address: molecule-proxy.example.test

    - name: Get Zabbix host object behind the proxy
      community.zabbix.zabbix_host_info:
        host_name: "{{ inventory_hostname }}"
        exact_match: true
      delegate_to: localhost
      register: zabbix_monitored_host_verify_host_proxy
      vars: *zabbix_monitored_host_verify_api_vars

    - name: Read a job unit behind the proxy
      ansible.builtin.slurp:
        path: /etc/systemd/system/molecule_ok.service
      register: zabbix_monitored_host_verify_unit_proxy

    - name: Check that the host is monitored by the proxy
      ansible.builtin.assert:
        that:
          # 1 = proxy; molecule-proxy is the only proxy, so any proxyid is it
          - zabbix_monitored_host_verify_host_proxy.hosts[0].monitored_by == '1'
          - zabbix_monitored_host_verify_host_proxy.hosts[0].proxyid != '0'
          - >-
            'ZBX=molecule-proxy.example.test'
            in (zabbix_monitored_host_verify_unit_proxy.content | b64decode)

    - name: Apply zabbix_monitored_host without the proxy
      ansible.builtin.include_role:
        name: zabbix_monitored_host

    - name: Get Zabbix host object after leaving the proxy
      community.zabbix.zabbix_host_info:
        host_name: "{{ inventory_hostname }}"
        exact_match: true
      delegate_to: localhost
      register: zabbix_monitored_host_verify_host_direct
      vars: *zabbix_monitored_host_verify_api_vars

    - name: Read a job unit after leaving the proxy
      ansible.builtin.slurp:
        path: /etc/systemd/system/molecule_ok.service
      register: zabbix_monitored_host_verify_unit_direct

    - name: Check that the host is monitored by the server again
      ansible.builtin.assert:
        that:
          - zabbix_monitored_host_verify_host_direct.hosts[0].monitored_by == '0'
          - >-
            'ZBX=zbx-server'
            in (zabbix_monitored_host_verify_unit_direct.content | b64decode)

    - name: Delete the test proxy object
      community.zabbix.zabbix_proxy:
        proxy_name: molecule-proxy
        state: absent
      delegate_to: localhost
      run_once: true
      vars: *zabbix_monitored_host_verify_api_vars
