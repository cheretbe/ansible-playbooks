---

- name: Install CA certificates
  hosts: "{{ ansible_limit | default(omit) }}"

  tasks:
    # importing a single task file bypasses the role's tasks/main.yml, so the
    # FQDN and distribution checks have to be asked for explicitly
    - name: Check host
      ansible.builtin.import_role:
        name: linux_provision
        tasks_from: check_host

    # and so does the step's enable flag, which tasks/main.yml applies for the
    # full run
    - name: Install CA certificates
      ansible.builtin.import_role:
        name: linux_provision
        tasks_from: ca_certificates
      when: linux_provision_ca_certificates_enabled | bool
